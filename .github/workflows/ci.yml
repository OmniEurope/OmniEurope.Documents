name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OmniEurope.Documents.slnx
      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors: any warning fails this step.
        run: dotnet build OmniEurope.Documents.slnx --configuration Release --no-restore
      - name: Unit tests
        # global.json runs dotnet test on Microsoft.Testing.Platform: xunit.v3 is the runner.
        run: >-
          dotnet test --project tests/OmniEurope.Documents.Tests/OmniEurope.Documents.Tests.csproj
          --configuration Release --no-build --no-progress
          --report-trx --report-trx-filename tests.trx --results-directory artifacts/tests
          --coverlet --coverlet-output-format cobertura
          --coverlet-include '[OmniEurope.Documents]*'
          --coverlet-exclude-by-attribute GeneratedCodeAttribute ExcludeFromCodeCoverageAttribute
      - name: Verify test results
        # A run that leaves no result file, executes no test, or reports a failed, errored, timed-out or
        # aborted test is a failure, never a silent pass.
        shell: pwsh
        run: ./.github/scripts/verify-trx.ps1 -Directory artifacts/tests -Name tests.trx
      - name: Verify coverage and CRAP
        shell: pwsh
        run: ./scripts/crap-gate.ps1 -CoverageRoot artifacts/tests -ReportPath artifacts/crap-scores.csv
      - name: Pack
        run: >-
          dotnet pack src/OmniEurope.Documents/OmniEurope.Documents.csproj
          --configuration Release --no-build --output artifacts/package
      - name: Verify package
        # No dependency, every font embedded and licensed, symbols present, no build machine path leaked.
        shell: pwsh
        run: ./.github/scripts/verify-package.ps1 -Directory artifacts/package -Fonts src/OmniEurope.Documents/Fonts/Bundled
      - name: Record validated package provenance
        shell: pwsh
        run: |
          ./.github/scripts/new-package-provenance.ps1 -PackageDirectory artifacts/package -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
          ./.github/scripts/test-package-provenance.ps1 -PackageDirectory artifacts/package -ExpectedCommit $env:GITHUB_SHA -ExpectedRepository $env:GITHUB_REPOSITORY -ExpectedRunId $env:GITHUB_RUN_ID -ExpectedRunAttempt $env:GITHUB_RUN_ATTEMPT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/package

  integration:
    # Thousands of damaged files, large documents and parallel conversions, kept out of the fast suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OmniEurope.Documents.slnx
      - name: Build
        run: dotnet build OmniEurope.Documents.slnx --configuration Release --no-restore
      - name: Integration tests
        run: >-
          dotnet test --project tests/OmniEurope.Documents.StressTests/OmniEurope.Documents.StressTests.csproj
          --configuration Release --no-build --no-progress
          --report-trx --report-trx-filename integration.trx --results-directory artifacts/integration
      - name: Verify test results
        shell: pwsh
        run: ./.github/scripts/verify-trx.ps1 -Directory artifacts/integration -Name integration.trx
